<div class="p-6 space-y-8 animate-in fade-in duration-500">
  
  <header class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white">QR Code Generator</h1>
      <p class="text-gray-500 dark:text-gray-400">Generate local QR code payloads dynamically</p>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- LEFT COLUMN: INPUT FORM -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-col h-[500px]">
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white flex items-center gap-2 mb-6">
        <svg class="w-5 h-5 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        Input Transmitter Data
      </h2>
      
      <div class="flex-1 space-y-5">
        <!-- Field 1 Input -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider block">Data Field 1</label>
          <input
            type="text"
            [(ngModel)]="field1"
            (ngModelChange)="updateQrCode()"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-900/50 text-gray-800 dark:text-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all font-medium"
            placeholder="Enter first parameter (e.g., Identifier, Device ID)..."
          />
        </div>

        <!-- Field 2 Input -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider block">Data Field 2</label>
          <textarea
            [(ngModel)]="field2"
            (ngModelChange)="updateQrCode()"
            rows="6"
            class="w-full px-4 py-3 rounded-xl border border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-900/50 text-gray-800 dark:text-gray-200 text-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all resize-none font-medium"
            placeholder="Enter second parameter (e.g., Description, Metadata, payload contents)..."
          ></textarea>
        </div>
      </div>

      <div class="text-xs text-gray-450 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700 pt-4">
        Tip: The QR Code dynamically updates on the right side as you type.
      </div>
    </div>

    <!-- RIGHT COLUMN: QR CODE PREVIEW & ACTIONS -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-col h-[500px]">
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white flex items-center gap-2 mb-6">
        <svg class="w-5 h-5 text-success-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
        </svg>
        QR Code & Live Preview
      </h2>

      <div class="flex-grow flex flex-col items-center justify-between space-y-4">
        <!-- QR Code Canvas with Glowing Borders -->
        <div class="relative p-3 bg-white rounded-2xl shadow-xl shadow-brand-500/5 border border-gray-100 dark:border-gray-700 group transition-all duration-300 hover:shadow-brand-500/10 mt-2">
          <!-- Brackets -->
          <div class="absolute -top-1 -left-1 w-4 h-4 border-t-2 border-l-2 border-brand-500 rounded-tl-md"></div>
          <div class="absolute -top-1 -right-1 w-4 h-4 border-t-2 border-r-2 border-brand-500 rounded-tr-md"></div>
          <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-2 border-l-2 border-brand-500 rounded-bl-md"></div>
          <div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-2 border-r-2 border-brand-500 rounded-br-md"></div>
          
          <div class="w-48 h-48 flex items-center justify-center overflow-hidden bg-gray-50 rounded-lg">
            <canvas id="qr-page-canvas" class="w-full h-full object-contain transition-transform duration-300 group-hover:scale-105"></canvas>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="flex flex-col gap-3 w-full">
          <div class="flex gap-3 w-full">
            <button 
              type="button"
              (click)="downloadQrCode()"
              class="flex-1 py-2 px-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 text-xs font-semibold hover:bg-gray-50 dark:hover:bg-gray-850 rounded-xl transition-all shadow-sm flex items-center justify-center gap-1.5"
            >
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
              Download QR
            </button>
            <button 
              type="button"
              (click)="copyJson()"
              class="flex-1 py-2 px-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 text-xs font-semibold hover:bg-gray-50 dark:hover:bg-gray-850 rounded-xl transition-all shadow-sm flex items-center justify-center gap-1.5"
            >
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2"/>
              </svg>
              Copy JSON
            </button>
          </div>
          
          <button 
            type="button"
            (click)="submit()"
            class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-brand-500/10 flex items-center justify-center gap-1.5"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Submit Data & Save Base64
          </button>
        </div>

        <!-- JSON Output Preview Box -->
        <div class="w-full space-y-1 text-left">
          <span class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest block">Payload Preview:</span>
          <pre class="w-full text-xs font-mono p-3 rounded-xl bg-gray-50 dark:bg-black/35 text-gray-600 dark:text-gray-400 border border-gray-100 dark:border-gray-700 overflow-x-auto max-h-[85px] leading-tight select-all"><code>{{ getJsonData() }}</code></pre>
        </div>
      </div>
    </div>

  </div>

</div>
