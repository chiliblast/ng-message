<div class="flex h-[calc(100vh-80px)] bg-gray-50 dark:bg-gray-950 overflow-hidden">
  
  <!-- LEFT SUB-SIDEBAR (MAILBOX NAVIGATION) -->
  <aside class="w-64 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-4 overflow-y-auto hidden lg:block">
    <div class="mt-4 space-y-6">
      <!-- Sent Metrics Card in Sidebar -->
      <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] shadow-sm">
        <div class="flex items-center justify-center w-10 h-10 bg-brand-50 dark:bg-brand-500/10 rounded-xl text-brand-600 mb-4">
          <fa-icon [icon]="faPaperPlane" class="text-xl"></fa-icon>
        </div>
        <div>
          <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total Sent</span>
          <h4 class="mt-1 font-bold text-gray-900 text-xl dark:text-white/90">{{messages.length}}</h4>
          <p class="text-[10px] text-gray-500 mt-1">Total messages sent by you</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- RIGHT MAIN CONTENT (SENT LIST) -->
  <main class="flex-1 flex flex-col bg-white dark:bg-gray-900 overflow-hidden">
    <header class="h-16 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-6 shrink-0">
      <div class="flex items-center gap-4">
        <h2 class="text-sm font-bold text-gray-900 dark:text-white">Sent Messages</h2>
      </div>

      <div class="relative w-64">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </span>
        <input 
          type="text" 
          placeholder="Search outbox..." 
          (input)="onFilterTextBoxChanged($event)"
          class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-800 border-none rounded-lg text-xs focus:ring-1 focus:ring-brand-500 outline-none text-gray-900 dark:text-white">
      </div>
    </header>

    <div class="flex-1 overflow-hidden p-6">
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 overflow-hidden shadow-sm h-full"
           [ngClass]="{'ag-theme-quartz-dark': (theme$ | async) === 'dark', 'ag-theme-quartz': (theme$ | async) !== 'dark'}">
        
        <ag-grid-angular
          style="width: 100%; height: 100%;"
          [theme]="'legacy'"
          [rowData]="messages"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [pagination]="true"
          [paginationPageSize]="20"
          (gridReady)="onGridReady($event)">
        </ag-grid-angular>

      </div>
    </div>
  </main>
</div>
