<div class="flex h-[calc(100vh-80px)] bg-gray-50 dark:bg-gray-950 overflow-hidden">
  
  <!-- LEFT SUB-SIDEBAR -->
  <aside class="w-64 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-4 hidden lg:block">
    <button class="w-full py-2.5 px-4 bg-brand-500 hover:bg-brand-600 text-white rounded-lg flex items-center justify-center gap-2 font-medium transition-colors shadow-lg shadow-brand-500/20 mb-8">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Compose
    </button>
    <!-- ... same sidebar content as Received ... -->
  </aside>

  <!-- RIGHT MAIN CONTENT (MESSAGE DETAIL) -->
  <main class="flex-1 flex flex-col bg-white dark:bg-gray-900 overflow-hidden">
    
    <!-- TOOLBAR -->
    <header class="h-16 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-8 shrink-0">
      <div class="flex items-center gap-2">
        <button class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </button>
        <button class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
        <button class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <button class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2m-4-1v8m0 0l3-3m-3 3L9 8m-5 8h10"/></svg>
        </button>
        <button class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </button>
      </div>

      <div class="flex items-center gap-4">
        <span class="text-[10px] text-gray-400 font-medium">{{message.time}}</span>
        <div class="flex items-center gap-1">
          <button class="p-1 hover:bg-gray-100 dark:hover:bg-white/5 rounded-md transition-colors text-gray-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button class="p-1 hover:bg-gray-100 dark:hover:bg-white/5 rounded-md transition-colors text-gray-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <div class="flex-1 overflow-y-auto p-8 lg:p-12">
      <!-- Header Info -->
      <div class="flex items-center gap-4 mb-10">
        <img [src]="message.avatar" alt="Avatar" class="w-12 h-12 rounded-full object-crop border-2 border-white dark:border-gray-800 shadow-sm">
        <div>
          <h1 class="text-lg font-bold text-gray-900 dark:text-white leading-tight">{{message.subject}}</h1>
          <p class="text-xs text-gray-500">
            <span class="font-semibold text-gray-700 dark:text-gray-300">{{message.sender}}</span> 
            <span class="ml-1">&lt;{{message.email}}&gt;</span>
          </p>
        </div>
      </div>

      <!-- Message Body -->
      <div class="space-y-4 max-w-3xl">
        <p *ngFor="let line of message.body" class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
          {{line}}
        </p>
      </div>

      <!-- Attachments -->
      <div class="mt-12 p-6 bg-gray-50 dark:bg-gray-800/30 rounded-2xl border border-gray-100 dark:border-gray-800">
        <div class="flex items-center gap-2 mb-6">
          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
          <span class="text-xs font-bold text-gray-900 dark:text-white">2 Attachments</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div *ngFor="let att of message.attachments" class="flex items-center gap-4 p-4 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-brand-500 transition-all group cursor-pointer">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center font-bold text-[10px]"
                 [ngClass]="att.type === 'PDF' ? 'bg-red-500/10 text-red-500' : 'bg-brand-500/10 text-brand-500'">
              {{att.icon}}
            </div>
            <div class="flex-1 overflow-hidden">
              <p class="text-xs font-bold text-gray-900 dark:text-white truncate">{{att.name}}</p>
              <p class="text-[10px] text-gray-500">{{att.type}} • {{att.size}}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="mt-12 flex flex-wrap gap-4">
        <button class="px-6 py-2.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl flex items-center gap-2 text-xs font-bold transition-all">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
          Reply
        </button>
        <button class="px-6 py-2.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl flex items-center gap-2 text-xs font-bold transition-all">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
          Reply all
        </button>
        <button class="px-6 py-2.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl flex items-center gap-2 text-xs font-bold transition-all">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5H19V11M19 5L5 19"/></svg>
          Forward
        </button>
      </div>
    </div>
  </main>

</div>
