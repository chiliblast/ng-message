<div class="relative border-2 rounded-xl overflow-hidden shadow-sm transition-all duration-300 h-full"
     [ngClass]="{
       'border-brand-500 ring-2 ring-brand-500/10': color === 'brand' && node.isOpen,
       'border-blue-500 ring-2 ring-blue-500/10': color === 'blue' && node.isOpen,
       'border-success-500 ring-2 ring-success-500/10': color === 'success' && node.isOpen,
       'border-warning-500 ring-2 ring-warning-500/10': color === 'warning' && node.isOpen,
       'border-purple-500 ring-2 ring-purple-500/10': color === 'purple' && node.isOpen,
       'border-indigo-500 ring-2 ring-indigo-500/10': color === 'indigo' && node.isOpen,
       'border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900': !node.isOpen,
       'animate-blink': (isBlinking$ | async)
     }">
  
  <!-- Status Indicator -->
  <div class="absolute top-1.5 left-1.5 w-2.5 h-2.5 rounded-full z-10 shadow-sm border-2 border-white dark:border-gray-900 transition-colors duration-500"
       [ngClass]="node.isOnline ? 'bg-emerald-500 shadow-emerald-500/50' : 'bg-red-500 shadow-red-500/20'"
       [title]="node.isOnline ? 'Online' : 'Offline'">
    <span *ngIf="node.isOnline" class="absolute inset-0 rounded-full bg-emerald-500 animate-ping opacity-75"></span>
  </div>
  
  <button (click)="toggleAccordion()" 
          class="w-full p-3 flex items-center justify-between text-left hover:bg-gray-50 dark:hover:bg-white/5 transition-colors focus:outline-none">
    <div class="flex items-center gap-1">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-white text-[10px] shadow-sm shrink-0"
           [ngClass]="{
             'bg-brand-500': color === 'brand',
             'bg-blue-500': color === 'blue',
             'bg-success-500': color === 'success',
             'bg-warning-500': color === 'warning',
             'bg-purple-500': color === 'purple',
             'bg-indigo-500': color === 'indigo'
           }">
        {{node.type}}
      </div>
      <div class="overflow-hidden min-w-0 flex-1">
        <h4 class="font-bold text-gray-900 dark:text-white leading-tight truncate" 
            [ngClass]="node.type == 1 ? 'text-base' : 'text-xs'">
          {{node.title}}
        </h4>
        <p class="text-[10px] text-gray-500 truncate">{{node.name}}</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- Action Indicators for Level 1 Header -->
      <div *ngIf="node.type == 1" class="flex gap-1.5 mr-2">
        <div *ngFor="let action of (statusActions$ | async)" 
             class="w-6 h-6 rounded-md border flex items-center justify-center text-[9px] font-black uppercase shadow-sm transition-all cursor-default"
             [style.borderColor]="action.color + '40'"
             [style.backgroundColor]="action.color + '10'"
             [style.color]="action.color">
          {{ action.label }}
        </div>
      </div>
      
      <svg class="w-3 h-3 text-gray-400 transition-transform duration-500 shrink-0" 
           [ngClass]="{'rotate-180': node.isOpen}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </button>

  <div class="transition-all duration-500 ease-in-out overflow-hidden" 
       [style.max-height]="node.isOpen ? '300px' : '0px'">
    <div (click)="selectNode($event)" class="p-3 pt-0 border-t border-gray-100 dark:border-gray-800 bg-gray-50/20 dark:bg-black/5 cursor-pointer hover:bg-gray-100/50 dark:hover:bg-white/5 transition-colors">
      <p class="mt-2 text-[10px] leading-relaxed text-gray-600 dark:text-gray-400">
        {{node.details}}
      </p>

      <!-- Action/Status Indicators (Global list, greyed out if not assigned) -->
      <div *ngIf="node.type != 1" class="mt-4 flex gap-2">
        <div *ngFor="let action of (statusActions$ | async)" 
             class="w-7 h-7 rounded-md border flex items-center justify-center text-[10px] font-bold uppercase shadow-sm transition-all cursor-default"
             [ngClass]="{
               'shadow-md scale-105 border-transparent animate-blink': getAction(action.id),
               'opacity-30': !getAction(action.id)
             }"
             [style.borderColor]="getAction(action.id) ? 'transparent' : action.color"
             [style.backgroundColor]="getAction(action.id) ? action.color : 'transparent'"
             [style.color]="getAction(action.id) ? 'white' : action.color"
             [title]="getAction(action.id) ? (getAction(action.id).name + ': ' + getAction(action.id).description) : (action.label + ': ' + action.description + ' (Not assigned)')">
          {{ action.label }}
        </div>
      </div>

      <!-- Action Icons (Shown only when selected and Level > 1) -->
      <div *ngIf="isSelected && node.type != 1" class="mt-4 flex items-center gap-3 animate-in fade-in slide-in-from-top-2 duration-300">
        <button (click)="startCall($event)" class="w-10 h-10 text-blue-500 hover:scale-110 hover:bg-blue-500/10 rounded-xl transition-all flex items-center justify-center border border-blue-500/10 bg-blue-500/5">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
        </button>
        <button (click)="showMessage($event)" class="w-10 h-10 text-emerald-500 hover:scale-110 hover:bg-emerald-500/10 rounded-xl transition-all flex items-center justify-center border border-emerald-500/10 bg-emerald-500/5">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
          </svg>
        </button>
        <button (click)="showProfile($event)" class="w-10 h-10 text-amber-500 hover:scale-110 hover:bg-amber-500/10 rounded-xl transition-all flex items-center justify-center border border-amber-500/10 bg-amber-500/5">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
      </div>
      
    </div>
  </div>
</div>
