<div class="relative border-t-1 rounded-xl overflow-hidden transition-all duration-500 h-full backdrop-blur-md"
     [ngClass]="{
       'border-brand-500': color === 'brand' && !isHighlighted,
       'border-blue-500': color === 'blue' && !isHighlighted,
       'border-success-500': color === 'success' && !isHighlighted,
       'border-warning-500': color === 'warning' && !isHighlighted,
       'border-purple-500': color === 'purple' && !isHighlighted,
       'border-indigo-500': color === 'indigo' && !isHighlighted,
       'shadow-[0_8px_30px_rgb(70,95,255,0.15)] bg-brand-50/5 dark:bg-brand-500/5': color === 'brand' && node.isOpen && !isHighlighted,
       'shadow-[0_8px_30px_rgb(59,130,246,0.15)] bg-blue-50/5 dark:bg-blue-500/5': color === 'blue' && node.isOpen && !isHighlighted,
       'shadow-[0_8px_30px_rgb(16,185,129,0.15)] bg-success-50/5 dark:bg-success-500/5': color === 'success' && node.isOpen && !isHighlighted,
       'shadow-[0_8px_30px_rgb(245,158,11,0.15)] bg-warning-50/5 dark:bg-warning-500/5': color === 'warning' && node.isOpen && !isHighlighted,
       'shadow-[0_8px_30px_rgb(168,85,247,0.15)] bg-purple-50/5 dark:bg-purple-500/5': color === 'purple' && node.isOpen && !isHighlighted,
       'shadow-[0_8px_30px_rgb(99,102,241,0.15)] bg-indigo-50/5 dark:bg-indigo-500/5': color === 'indigo' && node.isOpen && !isHighlighted,
       'bg-white/90 dark:bg-gray-900/90 shadow-sm': !node.isOpen && !isHighlighted,
       'animate-blink': (isBlinking$ | async),
       'border-yellow-400 ring-4 ring-yellow-400/40 scale-[1.03] z-50 shadow-[0_10px_40px_rgba(234,179,8,0.2)]': isHighlighted
     }">
  
  <!-- Online/Offline Glow Dot -->
  <div class="absolute w-2.5 h-2.5 rounded-full z-20 shadow-sm border-2 border-white dark:border-gray-900 transition-all duration-500"
       [ngClass]="node.isOnline ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-rose-500 shadow-[0_0_8px_#f43f5e]'"
       [title]="node.isOnline ? 'Online' : 'Offline'">
    <span *ngIf="node.isOnline" class="absolute inset-0 rounded-full bg-emerald-400 animate-ping opacity-75"></span>
  </div>
  
  <button (click)="toggleAccordion()" 
          class="w-full p-1 flex flex-col sm:flex-row sm:items-center justify-between text-left hover:bg-gray-50/80 dark:hover:bg-white/5 transition-all focus:outline-none select-none">
    
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <!-- Depth Level Indicator Badge -->
      <div class="w-5 h-5 rounded-xl flex items-center justify-center font-black text-xs shadow-md shrink-0 transition-transform duration-300 hover:rotate-12 border border-black/10 dark:border-white/25 text-gray-400 dark:text-gray-600"
           [ngClass]="{
             'bg-gradient-to-tr from-brand-600 to-brand-400': color === 'brand',
             'bg-gradient-to-tr from-blue-600 to-blue-400': color === 'blue',
             'bg-gradient-to-tr from-success-600 to-success-400': color === 'success',
             'bg-gradient-to-tr from-warning-600 to-warning-400 !text-gray-900 dark:!text-white': color === 'warning',
             'bg-gradient-to-tr from-purple-600 to-purple-400': color === 'purple',
             'bg-gradient-to-tr from-indigo-600 to-indigo-400': color === 'indigo'
           }">
        {{node.depthFromStart}}
      </div>
      
      <div class="overflow-hidden min-w-0 flex-1">
        <div class="flex items-center gap-1.5 mb-0.5">
          <h4 class="font-extrabold text-gray-900 dark:text-white leading-tight truncate tracking-wider text-base uppercase">
            {{node.displayName || node.fname}}
          </h4>
          
          <!-- Shortname Badge -->
          <span *ngIf="node.shortName" 
                class="text-[9px] font-black px-1.5 py-0.5 rounded-md bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 font-mono tracking-wider shrink-0 uppercase border border-gray-200/20">
            {{ node.shortName }}
          </span>
          
          <!-- UserType Badge -->
          <span *ngIf="node.userType" 
                class="text-[9px] font-bold px-1.5 py-0.5 rounded-md shrink-0 uppercase tracking-wide"
                [ngClass]="{
                  'bg-brand-500/10 text-brand-500 border border-brand-500/20': node.userType === 'ADMIN',
                  'bg-blue-500/10 text-blue-500 border border-blue-500/20': node.userType === 'MANAGER',
                  'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 border border-gray-200/10': node.userType === 'USER'
                }">
            {{ node.userType }}
          </span>
        </div>
       </div>
    </div>
    
    <!-- Progress Indicator Bar (For ANY node that has progress > 0) -->
    <div *ngIf="node.depthFromStart === 0 && node.progress !== undefined" class="flex items-center gap-4 mt-3 sm:mt-0 sm:ml-4 flex-1 max-w-xs w-full">
      <div class="flex-1">
        <div class="flex justify-between mb-1">
          <span class="text-[8px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">Task Progress</span>
          <span class="text-[8px] font-black uppercase tracking-widest"
                [ngClass]="{
                  'text-brand-500': color === 'brand',
                  'text-blue-500': color === 'blue',
                  'text-success-500': color === 'success',
                  'text-warning-500': color === 'warning',
                  'text-purple-500': color === 'purple',
                  'text-indigo-500': color === 'indigo'
                }">
            {{ node.progress }}%
          </span>
        </div>
        <div class="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2 shadow-inner overflow-hidden">
          <div class="h-full rounded-full transition-all duration-1000 ease-out" 
               [ngClass]="{
                 'bg-brand-500': color === 'brand',
                 'bg-blue-500': color === 'blue',
                 'bg-success-500': color === 'success',
                 'bg-warning-500': color === 'warning',
                 'bg-purple-500': color === 'purple',
                 'bg-indigo-500': color === 'indigo'
               }"
               [style.width.%]="node.progress"></div>
        </div>
      </div>
    </div>

    <!-- Right Header Controls -->
    <div class="flex items-center gap-2 mt-3 sm:mt-0 justify-end shrink-0">
      
      <!-- Dynamic Actions for Logged-In User (depthFromStart === 0) -->
      <div *ngIf="node.depthFromStart === 0" class="flex flex-wrap gap-1.5 mr-2" (click)="$event.stopPropagation()">
        <div *ngFor="let action of (statusActions$ | async)" 
             (click)="onActionBadgeClick(action.id, $event)"
             class="h-7 px-2.5 rounded-lg border flex items-center justify-center text-[9px] font-extrabold uppercase shadow-sm transition-all duration-300 cursor-pointer hover:scale-105 select-none shrink-0"
             [ngClass]="{
               'shadow-md scale-105 border-transparent': getAction(action.id),
               'animate-blink': getAction(action.id) && node.progress < 100,
               'opacity-60 border-dashed': !getAction(action.id)
             }"
             [style.borderColor]="getAction(action.id) ? 'transparent' : action.color"
             [style.backgroundColor]="getAction(action.id) ? action.color : 'transparent'"
             [style.color]="getAction(action.id) ? 'white' : action.color"
             [title]="getAction(action.id) ? (getAction(action.id).name + ': ' + getAction(action.id).description) : (action.label + ': ' + action.description + ' (Not assigned)')">
          {{ action.label }}
        </div>
      </div>

      <!-- Link Button to open Actions Modal (Shown for non-root nodes) -->
      <button *ngIf="node.depthFromStart !== 0" 
              (click)="selectNode($event)" 
              class="w-7 h-7 flex items-center justify-center rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400 hover:text-brand-500 hover:scale-105 transition-all mr-1"
              title="Open Actions Menu">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
      </button>

      <svg class="w-4 h-4 text-gray-400 transition-transform duration-500 shrink-0" 
           [ngClass]="{'rotate-180': node.isOpen}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </button>

  <!-- Accordion Body Drawer -->
  <div class="transition-all duration-500 ease-in-out overflow-hidden" 
       [style.max-height]="node.isOpen ? '300px' : '0px'">
    <div class="p-2 pt-0 border-t border-gray-105 dark:border-gray-800 bg-gray-50/30 dark:bg-black/10 cursor-pointer hover:bg-gray-100/50 dark:hover:bg-white/5 transition-all">
      
      <!-- <p class="mt-1 text-[11px] leading-relaxed font-medium text-gray-600 dark:text-gray-300">
        {{node.groupName}} ({{node.fname || ' '}})
      </p> -->

      <!-- Children Leaf Nodes Visualizer (Shown inside 2nd Last Level Accordion Drawer) -->
      <div *ngIf="node.isSecondLastLevel && node.children?.length" class="mt-2 flex flex-wrap gap-1.5" (click)="$event.stopPropagation()">
        <div *ngFor="let child of node.children; let idx = index" 
             (click)="onChildBadgeClick(child, $event)"
             class="h-7 w-7 rounded-lg border flex items-center justify-center font-extrabold uppercase shadow-sm transition-all duration-300 cursor-pointer hover:scale-110 select-none shrink-0"
             [ngClass]="{
               'shadow-md scale-105 border-transparent': child.progress > 0,
               'animate-blink': child.progress < 100 && child.progress > 0,
               'opacity-60 border-dashed': child.progress === 0
             }"
             [style.borderColor]="child.progress > 0 ? (child.actions?.[0]?.color || '#10b981') : '#9ca3af'"
             [style.background]="child.progress > 0 
               ? 'linear-gradient(to top, ' + (child.actions?.[0]?.color || '#10b981') + ' ' + child.progress + '%, ' + (child.actions?.[0]?.color || '#10b981') + '40 ' + child.progress + '%)' 
               : 'transparent'"
             [style.color]="child.progress > 0 ? 'white' : '#9ca3af'"
             [title]="child.displayName + ' (Progress: ' + child.progress + '%)'">
          {{ idx + 1 }}
        </div>
      </div>
      
    </div>
  </div>
</div>
