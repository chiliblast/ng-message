<div class="relative border-2 rounded-2xl overflow-hidden transition-all duration-500 h-full backdrop-blur-md"
     [ngClass]="{
       'border-brand-500 shadow-[0_8px_30px_rgb(70,95,255,0.15)] bg-brand-50/5 dark:bg-brand-500/5': color === 'brand' && node.isOpen && !isHighlighted,
       'border-blue-500 shadow-[0_8px_30px_rgb(59,130,246,0.15)] bg-blue-50/5 dark:bg-blue-500/5': color === 'blue' && node.isOpen && !isHighlighted,
       'border-success-500 shadow-[0_8px_30px_rgb(16,185,129,0.15)] bg-success-50/5 dark:bg-success-500/5': color === 'success' && node.isOpen && !isHighlighted,
       'border-warning-500 shadow-[0_8px_30px_rgb(245,158,11,0.15)] bg-warning-50/5 dark:bg-warning-500/5': color === 'warning' && node.isOpen && !isHighlighted,
       'border-purple-500 shadow-[0_8px_30px_rgb(168,85,247,0.15)] bg-purple-50/5 dark:bg-purple-500/5': color === 'purple' && node.isOpen && !isHighlighted,
       'border-indigo-500 shadow-[0_8px_30px_rgb(99,102,241,0.15)] bg-indigo-50/5 dark:bg-indigo-500/5': color === 'indigo' && node.isOpen && !isHighlighted,
       'border-gray-150 dark:border-gray-800 bg-white/90 dark:bg-gray-900/90 shadow-sm': !node.isOpen && !isHighlighted,
       'animate-blink': (isBlinking$ | async),
       'border-yellow-400 ring-4 ring-yellow-400/40 scale-[1.03] z-50 shadow-[0_10px_40px_rgba(234,179,8,0.2)]': isHighlighted
     }">
  
  <!-- Online/Offline Glow Dot -->
  <div class="absolute top-1 left-1 w-3 h-3 rounded-full z-20 shadow-sm border-2 border-white dark:border-gray-900 transition-all duration-500"
       [ngClass]="node.isOnline ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-rose-500 shadow-[0_0_8px_#f43f5e]'"
       [title]="node.isOnline ? 'Online' : 'Offline'">
    <span *ngIf="node.isOnline" class="absolute inset-0 rounded-full bg-emerald-400 animate-ping opacity-75"></span>
  </div>
  
  <button (click)="toggleAccordion()" 
          class="w-full p-2 flex flex-col sm:flex-row sm:items-center justify-between text-left hover:bg-gray-50/80 dark:hover:bg-white/5 transition-all focus:outline-none select-none">
    
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <!-- Depth Level Indicator Badge -->
      <div class="w-5 h-5 rounded-xl flex items-center justify-center font-black text-xs shadow-md shrink-0 transition-transform duration-300 hover:rotate-12 border border-black/10 dark:border-white/25 text-white dark:text-gray-500"
           [ngClass]="{
             'bg-gradient-to-tr from-brand-600 to-brand-400': color === 'brand',
             'bg-gradient-to-tr from-blue-600 to-blue-400': color === 'blue',
             'bg-gradient-to-tr from-success-600 to-success-400': color === 'success',
             'bg-gradient-to-tr from-warning-600 to-warning-400 !text-gray-900 dark:!text-white': color === 'warning',
             'bg-gradient-to-tr from-purple-600 to-purple-400': color === 'purple',
             'bg-gradient-to-tr from-indigo-600 to-indigo-400': color === 'indigo'
           }">
        {{node.depthFromStart}}
      </div>
      
      <div class="overflow-hidden min-w-0 flex-1">
        <div class="flex items-center gap-1.5 mb-0.5">
          <h4 class="font-extrabold text-gray-900 dark:text-white leading-tight truncate tracking-tight text-sm">
            {{node.displayName || node.groupName}}
          </h4>
          
          <!-- Shortname Badge -->
          <span *ngIf="node.shortName" 
                class="text-[9px] font-black px-1.5 py-0.5 rounded-md bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 font-mono tracking-wider shrink-0 uppercase border border-gray-200/20">
            {{ node.shortName }}
          </span>
          
          <!-- UserType Badge -->
          <span *ngIf="node.userType" 
                class="text-[9px] font-bold px-1.5 py-0.5 rounded-md shrink-0 uppercase tracking-wide"
                [ngClass]="{
                  'bg-brand-500/10 text-brand-500 border border-brand-500/20': node.userType === 'ADMIN',
                  'bg-blue-500/10 text-blue-500 border border-blue-500/20': node.userType === 'MANAGER',
                  'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 border border-gray-200/10': node.userType === 'USER'
                }">
            {{ node.userType }}
          </span>
        </div>
        <p class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 truncate">@{{node.fname || node.groupName}}</p>
      </div>
    </div>
    
    <!-- Progress Indicator Bar (For ANY node that has progress > 0) -->
    <div *ngIf="node.progress !== undefined" class="flex items-center gap-4 mt-3 sm:mt-0 sm:ml-4 flex-1 max-w-xs w-full">
      <div class="flex-1">
        <div class="flex justify-between mb-1">
          <span class="text-[8px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">Task Progress</span>
          <span class="text-[8px] font-black uppercase tracking-widest"
                [ngClass]="{
                  'text-brand-500': color === 'brand',
                  'text-blue-500': color === 'blue',
                  'text-success-500': color === 'success',
                  'text-warning-500': color === 'warning',
                  'text-purple-500': color === 'purple',
                  'text-indigo-500': color === 'indigo'
                }">
            {{ node.progress }}%
          </span>
        </div>
        <div class="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2 shadow-inner overflow-hidden">
          <div class="h-full rounded-full transition-all duration-1000 ease-out" 
               [ngClass]="{
                 'bg-brand-500': color === 'brand',
                 'bg-blue-500': color === 'blue',
                 'bg-success-500': color === 'success',
                 'bg-warning-500': color === 'warning',
                 'bg-purple-500': color === 'purple',
                 'bg-indigo-500': color === 'indigo'
               }"
               [style.width.%]="node.progress"></div>
        </div>
      </div>
    </div>

    <!-- Right Header Controls -->
    <div class="flex items-center gap-2 mt-3 sm:mt-0 justify-end shrink-0">
      
      <!-- Dynamic Actions for Logged-In User (depthFromStart === 0) -->
      <div *ngIf="node.depthFromStart === 0" class="flex flex-wrap gap-1.5 mr-2" (click)="$event.stopPropagation()">
        <div *ngFor="let action of (statusActions$ | async)" 
             class="h-7 px-2.5 rounded-lg border flex items-center justify-center text-[9px] font-extrabold uppercase shadow-sm transition-all duration-300 cursor-default select-none shrink-0"
             [ngClass]="{
               'shadow-md scale-105 border-transparent': getAction(action.id),
               'animate-blink': getAction(action.id) && node.progress < 100,
               'opacity-20 border-dashed': !getAction(action.id)
             }"
             [style.borderColor]="getAction(action.id) ? 'transparent' : action.color"
             [style.backgroundColor]="getAction(action.id) ? action.color : 'transparent'"
             [style.color]="getAction(action.id) ? 'white' : action.color"
             [title]="getAction(action.id) ? (getAction(action.id).name + ': ' + getAction(action.id).description) : (action.label + ': ' + action.description + ' (Not assigned)')">
          {{ action.label }}
        </div>
      </div>

      <!-- Header Action Indicators (Shows active action badges in a small format for other nodes) -->
      <div *ngIf="node.depthFromStart !== 0 && node.actions?.length" class="flex gap-1 mr-1">
        <div *ngFor="let action of node.actions" 
             class="w-5 h-5 rounded-md border flex items-center justify-center text-[8px] font-black uppercase shadow-sm transition-all"
             [style.borderColor]="action.color + '40'"
             [style.backgroundColor]="action.color + '10'"
             [style.color]="action.color"
             [title]="action.name">
          {{ action.label }}
        </div>
      </div>
      
      <svg class="w-4 h-4 text-gray-400 transition-transform duration-500 shrink-0" 
           [ngClass]="{'rotate-180': node.isOpen}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </button>

  <!-- Accordion Body Drawer -->
  <div class="transition-all duration-500 ease-in-out overflow-hidden" 
       [style.max-height]="node.isOpen ? '300px' : '0px'">
    <div (click)="selectNode($event)" 
         class="p-4 pt-0 border-t border-gray-105 dark:border-gray-800 bg-gray-50/30 dark:bg-black/10 cursor-pointer hover:bg-gray-100/50 dark:hover:bg-white/5 transition-all">
      
      <p class="mt-3 text-[11px] leading-relaxed font-medium text-gray-600 dark:text-gray-300">
        {{node.displayName || node.groupName}} ({{node.shortName || ''}}) - {{node.userType || 'USER'}}
      </p>

      <!-- Global Actions Listing (Greyed out if not matching active node action for other nodes) -->
      <div *ngIf="node.depthFromStart !== 0" class="mt-4 flex flex-wrap gap-2">
        <div *ngFor="let action of (statusActions$ | async)" 
             class="h-8 px-3 rounded-lg border flex items-center justify-center text-[10px] font-extrabold uppercase shadow-sm transition-all duration-300 cursor-default select-none"
             [ngClass]="{
               'shadow-md scale-105 border-transparent': getAction(action.id),
               'animate-blink': getAction(action.id) && node.progress < 100,
               'opacity-20 border-dashed': !getAction(action.id)
             }"
             [style.borderColor]="getAction(action.id) ? 'transparent' : action.color"
             [style.backgroundColor]="getAction(action.id) ? action.color : 'transparent'"
             [style.color]="getAction(action.id) ? 'white' : action.color"
             [title]="getAction(action.id) ? (getAction(action.id).name + ': ' + getAction(action.id).description) : (action.label + ': ' + action.description + ' (Not assigned)')">
          {{ action.label }}
        </div>
      </div>

      <!-- Action Buttons Drawer (Shown when Selected) -->
      <div *ngIf="isSelected && node.depthFromStart !== 0" 
           class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 flex items-center gap-3 animate-in fade-in slide-in-from-top-2 duration-300">
        
        <button (click)="startCall($event)" 
                class="w-10 h-10 text-blue-500 hover:scale-110 hover:bg-blue-500/10 rounded-xl transition-all flex items-center justify-center border border-blue-500/10 bg-blue-500/5"
                title="Initiate Call">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
        </button>
        
        <button (click)="showMessage($event)" 
                class="w-10 h-10 text-emerald-500 hover:scale-110 hover:bg-emerald-500/10 rounded-xl transition-all flex items-center justify-center border border-emerald-500/10 bg-emerald-500/5"
                title="Send Message">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
          </svg>
        </button>
        
        <button (click)="showProfile($event)" 
                class="w-10 h-10 text-amber-500 hover:scale-110 hover:bg-amber-500/10 rounded-xl transition-all flex items-center justify-center border border-amber-500/10 bg-amber-500/5"
                title="View on Map">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
      </div>
      
    </div>
  </div>
</div>
