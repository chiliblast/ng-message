<app-modal [isOpen]="isOpen" (close)="close.emit()" className="max-w-2xl">
  <div *ngIf="node" class="space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-4 border-b border-gray-100 dark:border-gray-800 pb-6">
      <div class="w-16 h-16 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-black text-2xl shadow-xl shadow-brand-500/20">
        {{ node.name?.charAt(0) }}
      </div>
      <div>
        <h2 class="text-2xl font-black text-gray-900 dark:text-white">{{ node.name }}</h2>
        <p class="text-sm font-bold text-brand-500 uppercase tracking-widest">{{ node.title }}</p>
      </div>
    </div>

    <!-- Info Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-4">
        <div class="p-4 rounded-2xl bg-gray-50 dark:bg-white/5 border border-gray-100 dark:border-gray-800">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Email Address</p>
          <p class="text-sm font-semibold text-gray-700 dark:text-gray-300">{{ node.name.toLowerCase().replace(' ', '.') }}@example.com</p>
        </div>
        <div class="p-4 rounded-2xl bg-gray-50 dark:bg-white/5 border border-gray-100 dark:border-gray-800">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Phone Number</p>
          <p class="text-sm font-semibold text-gray-700 dark:text-gray-300">+1 (555) 000-0000</p>
        </div>
      </div>
      
      <div class="p-4 rounded-2xl bg-gray-50 dark:bg-white/5 border border-gray-100 dark:border-gray-800">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Biography / Role</p>
        <p class="text-xs leading-relaxed text-gray-600 dark:text-gray-400">
          {{ node.details }}
        </p>
      </div>
    </div>

    <!-- Map Placeholder -->
    <div class="space-y-3">
      <p class="text-sm font-black text-gray-900 dark:text-white flex items-center gap-2">
        <svg class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Current Location
      </p>
      <div class="w-full h-64 rounded-3xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 relative overflow-hidden">
        <div id="modal-map" class="w-full h-full"></div>
      </div>
    </div>
  </div>
</app-modal>
