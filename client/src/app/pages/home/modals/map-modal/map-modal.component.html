<app-modal [isOpen]="isOpen" (close)="close.emit()" className="max-w-2xl">
  <div *ngIf="node" class="space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-4 border-b border-gray-100 dark:border-gray-800 pb-6">
      <div class="w-16 h-16 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-black text-2xl shadow-xl shadow-brand-500/20">
        {{ node.name?.charAt(0) }}
      </div>
      <div>
        <h2 class="text-2xl font-black text-gray-900 dark:text-white">{{ node.name }}</h2>
        <p class="text-sm font-bold text-brand-500 uppercase tracking-widest">{{ node.title }}</p>
      </div>
    </div>

    <!-- Info Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-4">
        <div class="p-4 rounded-2xl bg-gray-50 dark:bg-white/5 border border-gray-100 dark:border-gray-800">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Email Address</p>
          <p class="text-sm font-semibold text-gray-700 dark:text-gray-300">{{ node.name.toLowerCase().replace(' ', '.') }}@example.com</p>
        </div>
        <div class="p-4 rounded-2xl bg-gray-50 dark:bg-white/5 border border-gray-100 dark:border-gray-800">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Phone Number</p>
          <p class="text-sm font-semibold text-gray-700 dark:text-gray-300">+1 (555) 000-0000</p>
        </div>
      </div>
      
      <div class="p-4 rounded-2xl bg-gray-50 dark:bg-white/5 border border-gray-100 dark:border-gray-800">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Biography / Role</p>
        <p class="text-xs leading-relaxed text-gray-600 dark:text-gray-400">
          {{ node.details }}
        </p>
      </div>
    </div>

    <!-- Map Placeholder -->
    <div class="space-y-3">
      <p class="text-sm font-black text-gray-900 dark:text-white flex items-center gap-2">
        <svg class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Current Location
      </p>
      <div class="w-full h-64 rounded-3xl bg-gray-100 dark:bg-gray-800 border-2 border-dashed border-gray-200 dark:border-gray-700 flex flex-col items-center justify-center relative overflow-hidden group">
        <!-- Fake Map Texture -->
        <div class="absolute inset-0 opacity-20 bg-[url('https://www.google.com/maps/vt/pb=!1m4!1m3!1i12!2i2048!3i1280!2m3!1e0!2sm!3i420120488!3m8!2sen!3ius!5e1105!12m4!1e68!2m2!1sset!2sRoadmap!4e0!5m1!1f2!4sh@159000000!15i1!18m1!1b1!19m3!2m2!1sen!2sus!20e3!21m46!1m3!1m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659!3m12!2sen!3ius!5e1105!12m4!1e68!2m2!1sset!2sRoadmap!4e0!5m1!1f2!4sh@159000000!15i1!18m1!1b1!19m3!2m2!1sen!2sus!20e3!21m11!1m3!1m2!1i20301!2i9659!2m2!1i20301!2i9659!2m2!1i20301!2i9659')] bg-cover"></div>
        
        <div class="relative z-10 flex flex-col items-center gap-2">
          <div class="w-12 h-12 rounded-full bg-amber-500/20 text-amber-500 flex items-center justify-center animate-bounce shadow-lg shadow-amber-500/20">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          </div>
          <p class="text-xs font-black text-gray-500 uppercase tracking-widest">Map Loading...</p>
        </div>
        
        <!-- Google Maps Button Overlay (Fake) -->
        <div class="absolute bottom-4 right-4 px-4 py-2 bg-white dark:bg-gray-900 rounded-xl shadow-lg border border-gray-100 dark:border-gray-800 text-[10px] font-bold flex items-center gap-2">
          <img src="https://www.gstatic.com/images/branding/product/1x/maps_64dp.png" class="w-4 h-4" />
          Open in Google Maps
        </div>
      </div>
    </div>
  </div>
</app-modal>
