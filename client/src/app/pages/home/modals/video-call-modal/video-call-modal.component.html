<app-modal [isOpen]="isOpen" (close)="close.emit()" className="max-w-2xl">
  <div *ngIf="node" class="space-y-6">
    <!-- Header (Matches Profile UI) -->
    <div class="flex items-center gap-4 border-b border-gray-100 dark:border-gray-800 pb-6">
      <div class="w-16 h-16 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-black text-2xl shadow-xl shadow-brand-500/20">
        {{ node.name?.charAt(0) }}
      </div>
      <div>
        <h2 class="text-2xl font-black text-gray-900 dark:text-white">{{ node.name }}</h2>
        <p class="text-sm font-bold text-brand-500 uppercase tracking-widest">{{ node.title }}</p>
      </div>
    </div>

    <!-- Video Area -->
    <div class="relative aspect-video bg-gray-950 rounded-3xl overflow-hidden shadow-2xl">
      <!-- Remote Video Placeholder -->
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-2">
        <div class="w-20 h-20 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white font-bold text-2xl animate-pulse">
          {{ node.name?.charAt(0) }}
        </div>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest animate-pulse">Connecting...</p>
      </div>

      <!-- Local Preview -->
      <div class="absolute top-4 right-4 w-24 aspect-video bg-gray-800 rounded-xl border border-white/10 shadow-2xl overflow-hidden">
        <div class="w-full h-full flex items-center justify-center">
          <svg class="w-6 h-6 text-white/10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </div>
      </div>

      <!-- Inline Controls Overlay -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-3">
        <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/10 text-white flex items-center justify-center hover:bg-white/20 transition-all">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
        </button>
        <button (click)="close.emit()" class="w-12 h-12 rounded-full bg-red-500 text-white flex items-center justify-center hover:bg-red-600 transition-all shadow-lg shadow-red-500/20 rotate-[135deg]">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        </button>
        <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/10 text-white flex items-center justify-center hover:bg-white/20 transition-all">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</app-modal>
