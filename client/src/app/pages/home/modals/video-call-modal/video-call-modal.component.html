<app-modal [isOpen]="isOpen" (close)="close.emit()" className="max-w-2xl">
  <div *ngIf="node" class="space-y-6">
    <!-- Header (Matches Profile UI) -->
    <div class="flex items-center gap-4 border-b border-gray-100 dark:border-gray-800 pb-6">
      <div class="w-16 h-16 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-black text-2xl shadow-xl shadow-brand-500/20">
        {{ node.name?.charAt(0) }}
      </div>
      <div>
        <h2 class="text-2xl font-black text-gray-900 dark:text-white">{{ node.name }}</h2>
        <p class="text-sm font-bold text-brand-500 uppercase tracking-widest">{{ node.title }}</p>
      </div>
    </div>

    <!-- Video Area -->
    <div class="relative aspect-video bg-gray-950 rounded-3xl overflow-hidden shadow-2xl">
      <!-- Remote Video -->
      <video #remoteVideo autoplay playsinline class="absolute inset-0 w-full h-full object-cover bg-gray-900"></video>

      <!-- Connecting Overlay -->
      <div *ngIf="!isCallActive && !isIncoming" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-gray-900/50 backdrop-blur-sm">
        <div class="w-20 h-20 rounded-3xl bg-white/5 border border-white/10 flex items-center justify-center text-white font-bold text-2xl animate-pulse">
          {{ node.name?.charAt(0) }}
        </div>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest animate-pulse">Ringing...</p>
      </div>

      <!-- Incoming Call Overlay -->
      <div *ngIf="isIncoming && !isCallActive" class="absolute inset-0 bg-gray-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-8 text-center z-50">
        <div class="w-24 h-24 rounded-3xl bg-brand-500 text-white flex items-center justify-center font-black text-4xl shadow-2xl shadow-brand-500/20 mb-6 animate-bounce">
            {{ node.name?.charAt(0) }}
        </div>
        <h3 class="text-2xl font-black text-white mb-2">{{ node.name }}</h3>
        <p class="text-[10px] font-bold text-brand-500 uppercase tracking-widest mb-8">Incoming Call</p>
        
        <div class="flex gap-4">
            <button (click)="acceptCall()" class="w-16 h-16 rounded-full bg-success-500 text-white flex items-center justify-center shadow-lg shadow-success-500/20 hover:scale-110 transition-all">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            </button>
            <button (click)="rejectCall()" class="w-16 h-16 rounded-full bg-red-500 text-white flex items-center justify-center shadow-lg shadow-red-500/20 hover:scale-110 transition-all rotate-[135deg]">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            </button>
        </div>
      </div>

      <!-- Local Preview -->
      <div class="absolute top-4 right-4 w-32 aspect-video bg-gray-800 rounded-2xl border border-white/10 shadow-2xl overflow-hidden z-20">
        <video #localVideo autoplay playsinline [muted]="true" class="w-full h-full object-cover"></video>
        <div *ngIf="!isVideoEnabled" class="absolute inset-0 flex items-center justify-center bg-gray-900">
          <svg class="w-6 h-6 text-white/20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </div>
      </div>

      <!-- Inline Controls Overlay -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-4 z-30">
        <button (click)="toggleAudio()" 
                [class.bg-red-500]="isMuted" [class.bg-white/10]="!isMuted"
                class="w-12 h-12 rounded-full backdrop-blur-md border border-white/10 text-white flex items-center justify-center hover:scale-110 transition-all">
          <svg *ngIf="!isMuted" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
          <svg *ngIf="isMuted" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
        </button>
        <button (click)="endCall()" class="w-14 h-14 rounded-full bg-red-500 text-white flex items-center justify-center hover:scale-110 transition-all shadow-xl shadow-red-500/20 rotate-[135deg]">
          <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        </button>
        <button (click)="toggleVideo()" 
                [class.bg-red-500]="!isVideoEnabled" [class.bg-white/10]="isVideoEnabled"
                class="w-12 h-12 rounded-full backdrop-blur-md border border-white/10 text-white flex items-center justify-center hover:scale-110 transition-all">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</app-modal>
