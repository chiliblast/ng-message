<app-modal [isOpen]="isOpen" (close)="close.emit()" className="max-w-2xl">
  <div *ngIf="node" class="space-y-6">
    <!-- Header (Matches Pattern) -->
    <div class="flex items-center gap-4 border-b border-gray-100 dark:border-gray-800 pb-6">
      <div class="w-16 h-16 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-black text-2xl shadow-xl shadow-brand-500/20">
        {{ node.name?.charAt(0) }}
      </div>
      <div>
        <h2 class="text-2xl font-black text-gray-900 dark:text-white">{{ node.name }}</h2>
        <p class="text-sm font-bold text-brand-500 uppercase tracking-widest">{{ node.title }}</p>
      </div>
    </div>

    <!-- Message Input Section -->
    <div class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Text Input Panel -->
        <div class="space-y-2">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Your Message</label>
          <!-- <ckeditor
            [editor]="Editor"
            [(ngModel)]="messageText"
            [config]="editorConfig"
            class="block w-full border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden text-gray-700 dark:text-gray-300"
          ></ckeditor> -->
          <textarea
            [(ngModel)]="messageText"
            class="w-full px-4 py-3 h-32 rounded-2xl border border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900/50 text-gray-700 dark:text-gray-300 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all resize-none"
            placeholder="Type your message here..."
          ></textarea>
        </div>

        <!-- QR Code Panel -->
        <div class="space-y-2">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Input via QR Code</label>
          
          <!-- Placeholder (Click to scan) -->
          <div *ngIf="!isScanning" 
               (click)="startScanning()"
               class="w-full h-32 rounded-2xl bg-gray-50 dark:bg-white/5 border border-dashed border-gray-200 dark:border-gray-700 flex flex-col items-center justify-center gap-2 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors cursor-pointer group">
            <div class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-white/5 flex items-center justify-center text-gray-500 dark:text-gray-400 group-hover:scale-110 transition-transform">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 4h.01M12 12h.01M16 8h.01M8 8h.01M8 12h.01M8 16h.01M16 16h.01M4 4h4v4H4V4zm12 0h4v4h-4V4zm0 12h4v4h-4v-4zM4 16h4v4H4v-4z" />
              </svg>
            </div>
            <p class="text-xs font-bold text-gray-600 dark:text-gray-300">Scan QR Code</p>
            <p class="text-[10px] font-medium text-gray-400 dark:text-white/30">Click to activate camera</p>
          </div>

          <!-- Scanner Container -->
          <div *ngIf="isScanning" class="w-full h-32 rounded-2xl overflow-hidden bg-black relative">
            <div id="qr-reader" class="w-full h-full"></div>
            <button (click)="stopScanning()" class="absolute top-2 right-2 p-1.5 bg-black/50 text-white rounded-full hover:bg-black/70 transition-colors z-10">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Quick Action Selectors (Dynamic from DB) -->
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Select Category / Action</label>
        <div class="flex gap-3">
          <button 
            *ngFor="let action of (statusActions$ | async)"
            (click)="selectCategory(action.id)"
            [style.borderColor]="selectedActionId === action.id ? action.color : (hasAction(action.id) ? action.color : action.color + '40')"
            [style.backgroundColor]="selectedActionId === action.id ? action.color : (hasAction(action.id) ? action.color + '10' : action.color + '05')"
            [style.color]="selectedActionId === action.id ? 'white' : action.color"
            [ngClass]="{
              'shadow-lg scale-110': selectedActionId === action.id,
              'opacity-40': !hasAction(action.id) && selectedActionId !== action.id,
              'border-2': hasAction(action.id) && selectedActionId !== action.id
            }"
            class="w-10 h-10 rounded-xl border flex items-center justify-center text-xs font-black uppercase transition-all hover:scale-105"
            [title]="getAction(action.id) ? (getAction(action.id).name + ': ' + getAction(action.id).description) : (action.label + ': ' + action.description + ' (Not assigned)')"
          >
            {{ action.label }}
          </button>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="p-6 pt-2 flex items-center justify-end gap-3">
      <button 
        (click)="close.emit()"
        class="px-5 py-2.5 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/5 rounded-xl transition-all">
        Cancel
      </button>
      <button 
        (click)="sendMessage()"
        [disabled]="isSending || (!messageText && !selectedActionId)"
        class="flex items-center gap-2 px-6 py-2.5 text-sm font-semibold text-white bg-brand-500 hover:bg-brand-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl shadow-lg shadow-brand-500/20 transition-all">
        <span *ngIf="isSending" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        {{ isSending ? 'Sending...' : 'Send Message' }}
      </button>
    </div>
  </div>
</app-modal>
