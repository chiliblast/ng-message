<div class="p-6 space-y-8 animate-in fade-in duration-500">
  
  <header class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Location Management</h1>
      <p class="text-gray-500 dark:text-gray-400">Import and manage organizational locations via CSV</p>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- LEFT SIDE: IMPORT WORKBENCH -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-col h-[600px]">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white flex items-center gap-2">
          <i class="pi pi-upload text-brand-500"></i>
          Import Workbench
        </h2>
        <div class="flex gap-2">
          <label class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors text-sm font-medium">
            <span>Choose CSV</span>
            <input type="file" (change)="onFileChange($event)" accept=".csv" class="hidden">
          </label>
        </div>
      </div>

      <!-- Import Preview Grid -->
      <div class="flex-1 mb-6 rounded-xl overflow-hidden border border-gray-100 dark:border-gray-700">
        <ag-grid-angular
          style="width: 100%; height: 100%;"
          [theme]="'legacy'" [class]="(theme$ | async) === 'dark' ? 'ag-theme-quartz-dark' : 'ag-theme-quartz'"
          [rowData]="importData"
          [columnDefs]="importColumnDefs"
          [defaultColDef]="{ resizable: true }">
        </ag-grid-angular>
      </div>

      <div class="flex gap-4">
        <button 
          (click)="saveImport()" 
          [disabled]="importData.length === 0"
          class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl font-semibold shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center gap-2">
          <i class="pi pi-save"></i>
          Save to Database
        </button>
        <button 
          (click)="clearImport()" 
          [disabled]="importData.length === 0"
          class="px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl font-semibold transition-all">
          Clear
        </button>
      </div>
    </div>

    <!-- RIGHT SIDE: LIVE REGISTRY -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-col h-[600px]">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white flex items-center gap-2">
          <i class="pi pi-database text-success-500"></i>
          Location Registry
        </h2>
        <span class="px-3 py-1 bg-success-50 dark:bg-success-900/20 text-success-600 dark:text-success-400 rounded-full text-xs font-bold uppercase tracking-wider">
          {{ pagination.total }} Total
        </span>
      </div>

      <!-- Registry Grid -->
      <div class="flex-1 mb-6 rounded-xl overflow-hidden border border-gray-100 dark:border-gray-700">
        <ag-grid-angular
          style="width: 100%; height: 100%;"
          [theme]="'legacy'" [class]="(theme$ | async) === 'dark' ? 'ag-theme-quartz-dark' : 'ag-theme-quartz'"
          [rowData]="registryData"
          [columnDefs]="registryColumnDefs"
          [defaultColDef]="{ resizable: true }">
        </ag-grid-angular>
      </div>

      <!-- Pagination Controls -->
      <div class="flex items-center justify-between pt-4 border-t border-gray-50 dark:border-gray-700">
        <span class="text-sm text-gray-500">
          Page {{ pagination.page }} of {{ pagination.totalPages }}
        </span>
        <div class="flex gap-2">
          <button 
            (click)="prevPage()" 
            [disabled]="pagination.page === 1"
            class="p-2 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 disabled:opacity-30 transition-all">
            <i class="pi pi-chevron-left"></i>
          </button>
          <button 
            (click)="nextPage()" 
            [disabled]="pagination.page === pagination.totalPages"
            class="p-2 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 disabled:opacity-30 transition-all">
            <i class="pi pi-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
