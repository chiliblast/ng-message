<div class="p-5 border border-gray-200 dark:border-gray-800 rounded-2xl bg-gray-50/50 dark:bg-gray-900/30 flex flex-col items-center justify-center space-y-4">
  
  <!-- Fingerprint Icon button -->
  <button
    type="button"
    (click)="startWebAuthnLogin()"
    [disabled]="loading"
    class="relative group flex items-center justify-center w-16 h-16 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-md transition-all duration-300 hover:scale-105 active:scale-95 disabled:opacity-50"
    [ngClass]="{
      'border-brand-500 ring-4 ring-brand-500/20': isWebAuthnScanning,
      'hover:border-brand-400': !isWebAuthnScanning
    }"
  >
    <!-- Scanning Wave Animation -->
    <span 
      *ngIf="isWebAuthnScanning"
      class="absolute inset-0 rounded-full bg-brand-500/10 animate-ping"
    ></span>

    <!-- Scanner Laser line -->
    <span
      *ngIf="isWebAuthnScanning"
      class="absolute top-0 left-0 right-0 h-0.5 bg-brand-500 shadow-lg shadow-brand-500 animate-bounce"
      style="animation-duration: 2s;"
    ></span>

    <!-- SVG Fingerprint Icon -->
    <svg 
      class="w-8 h-8 text-gray-400 group-hover:text-brand-500 dark:text-gray-500 transition-colors"
      [ngClass]="{ 'text-brand-500': isWebAuthnScanning }"
      fill="none" 
      viewBox="0 0 24 24" 
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M2 12C2 6.5 6.5 2 12 2s10 4.5 10 10"></path>
      <path d="M5 19.5C6.5 18 8 16 10 16s3.5 2 5 3.5"></path>
      <path d="M8 22a7 7 0 0 1 8 0"></path>
      <path d="M8 15a4 4 0 0 1 8 0v2"></path>
      <path d="M12 5a7 7 0 0 0-7 7v4"></path>
      <path d="M12 9a3 3 0 0 0-3 3v5"></path>
    </svg>
  </button>

  <!-- Status & Actions -->
  <div class="text-center space-y-1">
    <p class="text-sm font-semibold text-gray-700 dark:text-gray-300">
      {{ webAuthnStatus || 'Verify Identity with Passkey' }}
    </p>
    <p class="text-xs text-gray-400 dark:text-gray-500">
      Use Windows Hello or device biometrics
    </p>
    
    <!-- Back Button (shown if authentication failed/canceled) -->
    <button 
      *ngIf="showBackButton"
      (click)="goBack.emit()"
      class="mt-4 inline-block text-xs font-semibold text-brand-500 hover:text-brand-600 transition-colors pt-2"
    >
      &larr; Back to Sign in
    </button>
  </div>
</div>
