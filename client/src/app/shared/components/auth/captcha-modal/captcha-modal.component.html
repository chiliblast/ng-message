<app-modal [isOpen]="isOpen" (close)="onClose()" className="max-w-[440px] w-full p-6">
  <div class="flex flex-col items-center justify-center space-y-5">
    
    <!-- Header Icon -->
    <div class="relative flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-500/10 dark:bg-brand-500/20 text-brand-500">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <span class="absolute -top-1 -right-1 flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
      </span>
    </div>

    <!-- Header Text -->
    <div class="text-center w-full">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Offline CAPTCHA Verification
      </h3>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
        Self-hosted, privacy-first challenge running 100% in your browser.
      </p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="grid grid-cols-2 p-1 bg-gray-100 dark:bg-gray-800/80 rounded-xl w-full text-xs font-medium">
      <button
        type="button"
        (click)="setMode('text')"
        class="py-1.5 px-3 rounded-lg transition-all cursor-pointer text-center"
        [ngClass]="{
          'bg-white dark:bg-gray-700 text-brand-600 dark:text-brand-400 shadow-2xs font-semibold': captchaMode === 'text',
          'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200': captchaMode !== 'text'
        }"
      >
        Alphanumeric
      </button>
      <button
        type="button"
        (click)="setMode('math')"
        class="py-1.5 px-3 rounded-lg transition-all cursor-pointer text-center"
        [ngClass]="{
          'bg-white dark:bg-gray-700 text-brand-600 dark:text-brand-400 shadow-2xs font-semibold': captchaMode === 'math',
          'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200': captchaMode !== 'math'
        }"
      >
        Math Puzzle
      </button>
    </div>

    <!-- Canvas Challenge Card -->
    <div class="relative w-full rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700/80 shadow-xs bg-gray-50 dark:bg-gray-850">
      <canvas
        #captchaCanvas
        width="380"
        height="95"
        class="w-full h-[95px] block select-none pointer-events-none"
      ></canvas>

      <!-- Floating Controls on Top-Right -->
      <div class="absolute right-2 top-2 flex items-center gap-1.5 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md p-1 rounded-xl shadow-xs border border-gray-200/60 dark:border-gray-700/60">
        <!-- Audio Read Button -->
        <button
          type="button"
          (click)="playAudio()"
          title="Listen to audio challenge (Speech Synthesis)"
          class="p-1.5 rounded-lg text-gray-500 hover:text-brand-600 dark:text-gray-400 dark:hover:text-brand-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>

        <!-- Refresh Button -->
        <button
          type="button"
          (click)="refreshCaptcha()"
          title="Regenerate CAPTCHA"
          class="p-1.5 rounded-lg text-gray-500 hover:text-brand-600 dark:text-gray-400 dark:hover:text-brand-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer"
        >
          <svg 
            class="w-4 h-4 transition-transform duration-500" 
            [ngClass]="{ 'rotate-180': isRotating }"
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"
          >
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>

      <!-- Offline Indicator Tag -->
      <div class="absolute left-2.5 bottom-2 flex items-center gap-1.5 bg-white/70 dark:bg-gray-900/70 backdrop-blur-xs px-2 py-0.5 rounded-md border border-gray-200/50 dark:border-gray-700/50">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span class="text-[10px] font-medium text-gray-600 dark:text-gray-300">100% Offline Mode</span>
      </div>
    </div>

    <!-- Input Section -->
    <div class="w-full space-y-2">
      <div class="relative">
        <input
          type="text"
          [(ngModel)]="userInput"
          (keydown.enter)="verify()"
          [disabled]="status === 'valid'"
          [placeholder]="captchaMode === 'text' ? 'Type the 6 characters shown above' : 'Enter the result of the calculation'"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-800 tracking-wider placeholder:tracking-normal placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 transition-all"
        />
        <button
          *ngIf="userInput && status !== 'valid'"
          type="button"
          (click)="userInput = ''"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Verification Result Banner -->
    <div *ngIf="status === 'valid'" class="w-full p-3.5 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-600/30 rounded-xl animate-fade-in shadow-2xs">
      <div class="flex items-center gap-2.5">
        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 shrink-0">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-emerald-800 dark:text-emerald-300">Human Identity Verified</p>
          <p class="text-[11px] font-mono text-emerald-700/80 dark:text-emerald-400/80 truncate mt-0.5">
            Token: {{ verificationToken }}
          </p>
        </div>
      </div>
    </div>

    <div *ngIf="status === 'invalid'" class="w-full p-3 bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-600/30 rounded-xl animate-fade-in">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-rose-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p class="text-xs text-rose-600 dark:text-rose-400 font-medium">
          {{ statusMessage }}
        </p>
      </div>
    </div>

    <!-- Modal Actions -->
    <div class="w-full space-y-2 pt-1">
      <app-button
        *ngIf="status !== 'valid'"
        className="w-full"
        (btnClick)="verify()"
        [disabled]="!userInput.trim()"
      >
        Verify CAPTCHA
      </app-button>

      <app-button
        *ngIf="status === 'valid'"
        className="w-full bg-emerald-600 hover:bg-emerald-700"
        (btnClick)="onClose()"
      >
        Done & Close
      </app-button>

      <button
        type="button"
        (click)="onClose()"
        class="w-full px-4 py-2 text-xs font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors rounded-lg cursor-pointer"
      >
        {{ status === 'valid' ? 'Close Window' : 'Cancel' }}
      </button>
    </div>

  </div>
</app-modal>
