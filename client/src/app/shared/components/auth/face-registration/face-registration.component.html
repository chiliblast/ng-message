<app-modal [isOpen]="isOpen" (close)="onClose()" className="max-w-[460px] w-full p-6">
  <div class="flex flex-col items-center justify-center space-y-5">
    
    <!-- Top Icon Badge -->
    <div class="relative flex items-center justify-center w-14 h-14 rounded-full bg-brand-500/10 dark:bg-brand-500/20 text-brand-600 dark:text-brand-400">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 10h.01M15 10h.01M9.5 15c.8 1 2.2 1 3 1s2.2 0 3-1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2m8-16h2a2 2 0 0 1 2 2v2m-4 12h2a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Header & Subtitle -->
    <div class="text-center w-full">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Register Face Recognition
      </h3>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
        Enter your password and position your face in the camera frame to enroll.
      </p>
    </div>

    <!-- Password Confirmation Input -->
    <div class="w-full text-left">
      <label class="block mb-1.5 text-xs font-medium text-gray-700 dark:text-gray-300">
        Confirm Account Password <span class="text-rose-500">*</span>
      </label>
      <div class="relative">
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          [(ngModel)]="password"
          placeholder="Enter password to verify identity"
          [disabled]="isScanning || loading"
          class="w-full rounded-lg border border-gray-200 bg-transparent px-4 py-2.5 text-sm text-gray-800 focus:border-brand-400 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 transition-colors"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          [disabled]="isScanning || loading"
          class="absolute z-10 -translate-y-1/2 cursor-pointer right-3 top-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
        >
          <svg *ngIf="showPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Active Camera Viewfinder Overlay (When Scanning or Verified) -->
    <div *ngIf="isScanning || faceVerified" class="w-full p-3 bg-gray-950 border border-brand-500/30 rounded-2xl shadow-xl overflow-hidden animate-fade-in text-white">
      <div class="flex items-center justify-between pb-2 border-b border-gray-800">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span class="text-xs font-semibold text-gray-200">Camera Viewfinder</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button
            type="button"
            (click)="toggleMirror()"
            class="px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-[10px] text-gray-300 border border-gray-700 flex items-center gap-1 transition-colors cursor-pointer"
            [title]="isMirrored ? 'Mirror view is ON. Click to toggle.' : 'Normal view is ON. Click to toggle.'"
          >
            <svg class="w-3 h-3 text-brand-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            <span>{{ isMirrored ? 'Mirror' : 'Normal' }}</span>
          </button>
          <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-brand-500/20 text-brand-400 border border-brand-500/30">
            Offline
          </span>
        </div>
      </div>

      <!-- Viewfinder Video & Display Canvas Container -->
      <div class="relative w-full aspect-video mt-2.5 rounded-xl overflow-hidden bg-black flex items-center justify-center border border-gray-800 shadow-inner">
        <!-- Hidden Video for stream decoding -->
        <video 
          #faceVideo 
          autoplay 
          playsinline 
          muted 
          class="hidden"
        ></video>
        
        <!-- Hidden Canvas for full-resolution snapshot -->
        <canvas #captureCanvas class="hidden"></canvas>
        
        <!-- Active Mirrored Display Canvas -->
        <canvas 
          #displayCanvas 
          class="w-full h-full object-cover object-center"
        ></canvas>

        <!-- Face Target Oval HUD Guidelines -->
        <div *ngIf="!faceVerified" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center p-4">
          <div class="w-32 h-44 sm:w-36 sm:h-48 rounded-[50%] border-2 border-dashed border-brand-400/70 flex items-center justify-center">
            <div class="w-full h-0.5 bg-brand-400/40 shadow-[0_0_8px_#38bdf8] animate-pulse"></div>
          </div>
          <!-- Corner brackets -->
          <div class="absolute top-3 left-3 w-4 h-4 border-t-2 border-l-2 border-brand-400"></div>
          <div class="absolute top-3 right-3 w-4 h-4 border-t-2 border-r-2 border-brand-400"></div>
          <div class="absolute bottom-3 left-3 w-4 h-4 border-b-2 border-l-2 border-brand-400"></div>
          <div class="absolute bottom-3 right-3 w-4 h-4 border-b-2 border-r-2 border-brand-400"></div>
        </div>

        <!-- Face Captured Success Overlay -->
        <div *ngIf="faceVerified" class="absolute inset-0 bg-gray-950/85 backdrop-blur-xs flex flex-col items-center justify-center p-4 z-30 animate-fade-in text-white text-center">
          <div class="w-12 h-12 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center mb-2 animate-bounce">
            <svg class="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <p class="font-semibold text-sm text-emerald-300">Face Captured!</p>
          <p class="text-[11px] text-gray-300 mt-0.5">Enrolling biometric template into database...</p>
        </div>
      </div>

      <!-- Real-time Status Guidance -->
      <div class="mt-2.5 px-1 flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5 text-gray-300">
          <svg class="w-3.5 h-3.5 text-brand-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="font-medium text-[11px] truncate">{{ faceStatus }}</span>
        </div>
      </div>

      <!-- Camera Action Buttons (Snapshot & Test) -->
      <div class="mt-3 grid grid-cols-2 gap-2 pt-2 border-t border-gray-800">
        <button
          type="button"
          (click)="captureFaceSnapshot()"
          [disabled]="loading"
          class="py-1.5 px-3 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          </svg>
          <span>Take Snapshot</span>
        </button>

        <button
          type="button"
          (click)="useMockFace()"
          [disabled]="loading"
          class="py-1.5 px-3 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs font-medium flex items-center justify-center gap-1.5 border border-gray-700 transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          <span>Use Test Face</span>
        </button>
      </div>
    </div>

    <!-- Main Action Buttons -->
    <div class="w-full space-y-3 pt-1">
      <app-button
        *ngIf="!isScanning"
        className="w-full"
        (btnClick)="startScan()"
        [loading]="loading"
        [disabled]="!password.trim() || loading"
      >
        <span>Start Face Scan</span>
      </app-button>

      <app-button
        *ngIf="isScanning"
        className="w-full"
        (btnClick)="captureFaceSnapshot()"
        [loading]="loading"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Capture & Register Face</span>
        <span *ngIf="loading">Enrolling Face Biometrics...</span>
      </app-button>
      
      <button 
        type="button"
        class="w-full px-4 py-2 text-sm font-medium text-gray-500 transition-colors bg-transparent border-0 rounded-lg hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300 cursor-pointer"
        (click)="onClose()"
        [disabled]="loading"
      >
        Cancel
      </button>
    </div>

  </div>
</app-modal>
