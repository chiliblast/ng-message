<div class="h-10 w-full flex items-center justify-between px-4 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.05)]">
  <div class="flex items-center gap-3 w-full overflow-hidden">
    
    <!-- Blinking Indicator -->
    <span class="flex h-2.5 w-2.5 relative shrink-0">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
    </span>

    <!-- Flashing Message from Mock API -->
    <div class="text-[11px] sm:text-xs font-bold text-gray-700 dark:text-gray-300 truncate w-full tracking-wide">
      <span *ngIf="message$ | async as msg" class="animate-pulse">
        {{ msg }}
      </span>
      <span *ngIf="!(message$ | async)" class="text-gray-400 dark:text-gray-500 animate-pulse">
        Loading latest broadcast...
      </span>
    </div>
  </div>

  <div class="shrink-0 text-[10px] font-black uppercase text-gray-400 dark:text-gray-500 tracking-wider pl-4 hidden sm:block">
    Ng-Message v1.0
  </div>
</div>
