# ===================================================================
# NG-Message Java Biometric Backend Configuration
# ===================================================================

server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ng-message?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# File / Request limits (for high-resolution biometric image Base64 uploads)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Configuration (matches Node server key for unified compatibility)
app.jwt.secret=AJH|80J*KLKS902JLAJD01_92
app.jwt.expiration-ms=86400000

# Biometric Matching Thresholds
# SourceAFIS similarity score threshold: 40 is recommended standard (FAR 1:10,000)
biometric.fingerprint.threshold=40.0

# Facial recognition cosine similarity threshold (0.0 to 1.0, 0.70+ indicates match)
biometric.face.threshold=0.68

# CORS configuration
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
