# ===================================================================
# NG-Message Java ANT Biometric Server Configuration
# ===================================================================

# Server Port (default 8082 to avoid conflict with Spring Boot on 8080)
server.port=8082

# MySQL Database Configuration
db.url=jdbc:mysql://localhost:3306/ng-message?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
db.user=root
db.password=

# JWT Configuration (matches Node & Spring Boot secret for unified tokens)
jwt.secret=AJH|80J*KLKS902JLAJD01_92
jwt.expiration-ms=86400000

# Biometric Matching Thresholds
# SourceAFIS minutiae score threshold (40.0 recommended for FAR 1:10,000)
biometric.fingerprint.threshold=40.0

# Facial recognition cosine similarity threshold (0.68 - 0.70)
biometric.face.threshold=0.68

# CORS
cors.allowed-origins=*
